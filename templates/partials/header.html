<header class="h-[70px] bg-white border-b border-slate-200 px-8 flex items-center justify-between sticky top-0 z-25">
  <div class="header-title">
    <h2 class="text-lg font-bold text-qt-dark tracking-tight">{% block header_title %}{{ company.short_name|default:"QT Consultancy" }} HR & Payroll Hub{% endblock %}</h2>
  </div>
  <div class="flex items-center gap-5">
    <div class="bg-qt-light text-qt-primary text-xs font-bold px-4 py-1.5 rounded-full border border-blue-200 flex items-center gap-2">
      <span class="w-1.5 h-1.5 bg-qt-primary rounded-full animate-pulse"></span>
      Active Period: {{ active_period|default:"June 2026" }}
    </div>
    <div id="nav-system-time" class="text-xs font-medium text-slate-400">{{ current_time|default:"02/06/2026 | 15:30" }}</div>
  </div>
</header>
