<header class="h-[70px] bg-white border-b border-slate-200 px-4 md:px-8 flex items-center justify-between sticky top-0 z-25 print:hidden">
  <div class="flex items-center gap-3">
    <!-- Hamburger Button for Mobile -->
    <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-xl hover:bg-slate-100 text-lg flex items-center justify-center text-slate-600 border border-slate-200 bg-slate-50 transition-colors" aria-label="Toggle Sidebar">
      ☰
    </button>
    <div class="header-title">
      <h2 class="text-xs sm:text-sm md:text-lg font-bold text-qt-dark tracking-tight">{% block header_title %}{{ company.short_name|default:"QT Consultancy" }} HR & Payroll Hub{% endblock %}</h2>
    </div>
  </div>
  <div class="flex items-center gap-3 md:gap-5">
    <div class="bg-qt-light text-qt-primary text-[10px] md:text-xs font-bold px-3 py-1.5 rounded-full border border-blue-200 flex items-center gap-1.5 shrink-0">
      <span class="w-1.5 h-1.5 bg-qt-primary rounded-full animate-pulse"></span>
      <span class="hidden sm:inline">Active Period: </span>{{ active_period|default:"June 2026" }}
    </div>
    <div id="nav-system-time" class="text-[10px] md:text-xs font-medium text-slate-400 shrink-0">{{ current_time|default:"02/06/2026 | 15:30" }}</div>
  </div>
</header>
