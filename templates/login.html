{% extends "base.html" %}
{% block title %}Login | {{ company.short_name|default:"QT Consultancy" }}{% endblock %}
{% block body %}
<main class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-slate-50 via-slate-100 to-sky-100">
  <section class="w-full max-w-md bg-white rounded-3xl border border-slate-200 shadow-2xl p-10">
    <h1 class="text-2xl font-black text-slate-800 mb-2">{{ company.short_name|default:"QT Consultancy" }}</h1>
    <p class="text-slate-500 mb-8">HR & Payroll Administrative Gate</p>
    {% if error %}<div class="mb-4 text-sm text-red-600">{{ error }}</div>{% endif %}
    <form method="post" class="space-y-5">
      {% csrf_token %}
      <input name="email" type="email" placeholder="admin@company.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50">
      <input name="password" type="password" placeholder="Password" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50">
      <button class="w-full py-3.5 rounded-xl bg-slate-800 text-white font-bold">Secure Log In</button>
    </form>
  </section>
</main>
{% endblock %}
