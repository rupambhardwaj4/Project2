<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QT Consultancy - Administrative Log In</title>
    
    <!-- Synchronous theme loader from localStorage -->
    <script>
      (function() {
          const cached = localStorage.getItem("qt_consultancy_state");
          let primaryColor = '#88BDF2';
          let darkColor = '#384959';
          if (cached) {
              try {
                  const state = JSON.parse(cached);
                  const settings = state.companySettings || state.settings;
                  if (settings) {
                      primaryColor = settings.primaryColor || settings.themeColor || primaryColor;
                      darkColor = settings.sidebarColor || settings.themeColorDark || darkColor;
                  }
              } catch(e) {}
          }
          document.documentElement.style.setProperty('--qt-primary', primaryColor);
          document.documentElement.style.setProperty('--qt-dark', darkColor);
          document.documentElement.style.setProperty('--primary', primaryColor);
          document.documentElement.style.setProperty('--bg-sidebar', darkColor);
          window.qtTheme = { primaryColor, darkColor };
      })();
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              qt: {
                light: '#BDDDFC',    // Very Light Pastel Blue
                medium: '#6A89A7',   // Muted Steel/Blue-grey
                primary: 'var(--qt-primary)',  // Dynamic
                dark: 'var(--qt-dark)',     // Dynamic
                darker: '#26323d'    // Slightly darker Charcoal
              }
            },
            fontFamily: {
              sans: ['Poppins', 'Inter', 'sans-serif']
            }
          }
        }
      }
    </script>

    <!-- Google Fonts Poppins & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css"> <!-- Helper classes -->
</head>
<body class="bg-slate-100 font-sans text-qt-dark min-h-screen flex items-center justify-center p-6 antialiased bg-gradient-to-br from-slate-50 via-slate-100 to-qt-light/35">

    <div class="w-full max-w-[440px] bg-white rounded-3xl border border-slate-200 shadow-2xl p-10 flex flex-col justify-center relative animate-scaleUp">
        
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-2.5 mb-3">
                <div class="w-10 h-10 bg-qt-primary rounded-xl flex items-center justify-center text-white font-extrabold text-lg shadow-lg shadow-qt-primary/15" data-company="logo">
                    QT
                </div>
                <h1 class="text-2xl font-black text-qt-dark leading-none" data-company="shortName">QT Consultancy</h1>
            </div>
            <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">HR & Payroll Administrative Gate</p>
        </div>
        
        <form id="login-form" class="space-y-5">
            <div class="flex flex-col gap-2">
                <label for="login-email" class="text-xs font-bold text-qt-dark tracking-wide">Administrative Email</label>
                <input type="email" id="login-email" required placeholder="admin@company.com" autocomplete="username" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-qt-primary focus:ring-2 focus:ring-qt-light font-medium bg-slate-50">
            </div>
            
            <div class="flex flex-col gap-2">
                <div class="flex justify-between items-center">
                    <label for="login-password" class="text-xs font-bold text-qt-dark tracking-wide">Password</label>
                    <a href="#" id="forgot-password-link" class="text-xs font-bold text-qt-primary hover:text-qt-dark transition-colors">Forgot password?</a>
                </div>
                <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-qt-primary focus:ring-2 focus:ring-qt-light font-medium bg-slate-50">
            </div>
            
            <button type="submit" class="w-full py-3.5 bg-qt-primary hover:bg-qt-dark text-white rounded-xl font-bold text-sm shadow-md shadow-qt-primary/10 transition-all duration-200 mt-2">
                Secure Log In
            </button>
        </form>
        
        <div class="mt-8 p-4 rounded-xl bg-slate-50 border border-slate-100 flex items-start gap-3 text-[0.7rem] text-slate-500 leading-normal">
            <span class="text-base">🔒</span>
            <div>
                <strong>Secure Connection:</strong> Encrypted via 256-bit SSL protocol. Internal <span data-company="shortName">QT Consultancy</span> corporate networks access only.
            </div>
        </div>
        
        <div class="text-center mt-6">
            <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-qt-primary transition-colors duration-150 flex items-center justify-center gap-1.5">
                ← Back to Public Site
            </a>
        </div>
    </div>

    <!-- Toast container for notifications -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[200] flex flex-col gap-3 max-w-sm pointer-events-none"></div>

    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const settings = state.companySettings || DEFAULT_COMPANY_SETTINGS;
            const emailInput = document.getElementById("login-email");
            if (emailInput && settings.supportEmail) {
                emailInput.placeholder = settings.supportEmail;
            }

            const form = document.getElementById("login-form");
            form.addEventListener("submit", (e) => {
                e.preventDefault();
                const email = document.getElementById("login-email").value.trim();
                const pass = document.getElementById("login-password").value.trim();

                if ((email === "admin@company.com" || (settings.supportEmail && email === settings.supportEmail)) && pass === "admin123") {
                    state.currentUser = { email: email, name: "Finance Manager", role: "Administrator" };
                    saveStateToStorage();
                    Auditor.log(`Administrator successfully authenticated into the ${settings.shortName || "corporate"} administrative portal.`);
                    window.location.href = "dashboard.html";
                } else {
                    Toast.show(`Invalid credentials. Try: ${settings.supportEmail || "admin@company.com"} / admin123`, "danger");
                    Auditor.log("Failed administrative authentication attempt: " + email);
                }
            });

            document.getElementById("forgot-password-link").addEventListener("click", (e) => {
                e.preventDefault();
                alert("Security Override: Please contact the corporate IT Operations Desk (extension 410) to reset your master database administrative key.");
            });
        });
    </script>
</body>
</html>
